<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>价格数字滚轮 · 三良中古</title><link rel="stylesheet" href="rolling-demo.css"></head><body><main><a href="index.html">‹ 返回三良中古</a><h1>价格数字滚轮</h1><p class="description">逐位滚动 · 连续切换 · 增加向上，减少向下</p><section><p class="label">商品价格</p><p class="price"><small>¥</small><span id="product-price"></span></p><div class="buttons" id="conditions"><button data-value="17680" aria-pressed="true">98新</button><button data-value="13790" aria-pressed="false">7成新</button><button data-value="11138" aria-pressed="false">6成新</button></div></section><section><p class="label">含小数与千位分隔符</p><p class="balance"><span>$</span><span id="balance"></span></p><div class="buttons" id="amounts"><button data-value="24092.67" aria-pressed="true">24,092.67</button><button data-value="24103.78" aria-pressed="false">24,103.78</button><button data-value="9999.99" aria-pressed="false">9,999.99</button><button data-value="100000.01" aria-pressed="false">100,000.01</button></div></section><p class="description">可以快速连续点击，正在滚动的数字会从当前位置接续。保留货币符号、分隔符及小数点的位置。</p></main><script src="rolling-number.js?v=2"></script><script src="rolling-demo.js?v=2"></script></body></html>
