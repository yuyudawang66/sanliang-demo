<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收货地址 · 三良中古</title><link rel="stylesheet" href="addresses.css"></head><body data-page="create"><main class="address-page"><header><div class="status"><img src="assets/addresses/system-status.svg" width="375" height="44" alt="9:41"></div><nav><a class="back" aria-label="返回" href="order.html"><img src="assets/addresses/icon-back.svg" width="24" height="24" alt=""></a><h1>新增收货地址</h1></nav></header><section class="create-content"><form id="address-form" class="create-form"><label class="form-row"><span>收货人</span><input name="name" placeholder="收货人姓名" type="text" autocomplete="name" required maxlength="150"></label><label class="form-row"><span>手机号</span><input name="phone" placeholder="收货人手机号" type="tel" autocomplete="tel" required maxlength="150"></label><label class="form-row"><span>所在地区</span><input name="district" placeholder="省、市、区、街道" type="text" autocomplete="address-level2" required maxlength="150"></label><label class="form-row"><span>详细地址</span><input name="street" placeholder="社区、门牌号等" type="text" autocomplete="street-address" required maxlength="150"></label><div class="form-row default-row"><span>设为默认地址</span><button type="button" class="switch" role="switch" aria-label="设为默认地址" aria-checked="false"><img src="assets/addresses/switch-default-address-off.svg" width="40" height="20" alt=""></button></div><div class="recognition-wrap"><div class="recognition"><textarea id="recognition-text" aria-label="地址文本" placeholder="粘贴文本至此处，可自动识别信息并填写"></textarea><button type="button" class="recognize">粘贴并识别</button></div></div></form></section><footer class="address-footer"><button type="submit" form="address-form" class="primary">新建保存地址</button><div class="home"><img src="assets/addresses/system-home-indicator.svg" width="375" height="34" alt=""></div></footer></main><dialog id="delete-dialog"><p>确认删除此收货地址？</p><menu><form method="dialog"><button>取消</button></form><button id="confirm-delete">删除地址</button></menu></dialog><div class="toast" role="status"></div><script src="addresses.js"></script></body></html>
